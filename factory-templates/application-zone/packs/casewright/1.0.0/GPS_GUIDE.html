                    ],

                        "Build more complex queries to explore all agents"

                }
            ]

        async function loadGPSTemplate() {
            try {
                const templatePath = '../../GPS_GUIDE_TEMPLATE.html';
                const response = await fetch(templatePath);
                
                if (!response.ok) {
                    throw new Error(`Failed to load template: ${response.statusText}`);
                }

                const templateHTML = await response.text();
                document.documentElement.innerHTML = templateHTML;
                window.appConfig = appConfig;

                if (window.initializeGPS) {
                    window.initializeGPS();
                }
            } catch (error) {
                document.body.innerHTML = `
                    <div style="padding: 40px; text-align: center; color: #d32f2f;">
                        <h2>⚠️ Error Loading GPS Guide</h2>
                        <p style="margin: 20px 0; font-family: monospace; background: #f5f5f5; padding: 15px; border-radius: 8px;">
                            ${error.message}
                        </p>
                        <p style="color: #666;">Template should be at: <strong>../../GPS_GUIDE_TEMPLATE.html</strong></p>
                        <p style="color: #999; font-size: 0.9em;">Current path: ${window.location.pathname}</p>
                    </div>
                `;
                console.error('GPS Guide Error:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadGPSTemplate);
    </script>
</body>
</html>
