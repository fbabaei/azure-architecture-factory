<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading GPS Guide...</title>
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #f5f5f5; margin: 0;">
    <div style="text-align: center;">
        <h2 style="color: #667eea; margin-bottom: 20px;">Loading Application Zone GPS Guide...</h2>
        <div style="width: 40px; height: 40px; border: 4px solid #667eea; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
    </div>

    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <script>
        // ============================================================================
        // GPS GUIDE WRAPPER FOR NEW APPLICATIONS
        // ============================================================================
        // 
        // STEP 1: Load the template HTML
        // STEP 2: Inject your app's configuration
        // STEP 3: Done! The template handles everything else
        //
        // ============================================================================

        // STEP 1: Define your app's GPS configuration
        // Copy this structure from gps-config.template.json and customize for your app
        const appConfig = {
            appName: "Your App Name",           // Replace with your app name
            subtitle: "Know exactly where you are in your journey",
            agentCount: 6,                      // How many agents your app exposes
            runtimePort: 8000,                  // Port your runtime listens on
            startStage: 0,                      // Which stage to show first (0-indexed)
            stages: [
                {
                    number: 0,
                    emoji: "🚀",
                    shortName: "Start",
                    name: "🚀 Let's Begin!",
                    timing: "1 minute",
                    description: "Welcome to the Application Zone. You're about to discover a multi-agent platform.",
                    details: {
                        title: "What you'll learn:",
                        items: [
                            "How to discover agents",
                            "How to invoke agents",
                            "How to build payloads"
                        ]
                    },
                    tip: "Take your time reading through each stage.",
                    substages: [
                        "Read this guide",
                        "Understand the flow",
                        "Prepare your environment"
                    ],
                    checklist: [
                        "Read this guide",
                        "Understand the architecture",
                        "Prepare your environment"
                    ],
                    landmark: "You understand the overall flow"
                }
                // ADD MORE STAGES HERE - see gps-config.template.json for full structure
            ]
        };

        // STEP 2: Load the template
        async function loadGPSTemplate() {
            try {
                // Load the reusable template from the parent directory
                const templatePath = '../GPS_GUIDE_TEMPLATE.html';
                const response = await fetch(templatePath);
                
                if (!response.ok) {
                    throw new Error(`Failed to load template: ${response.statusText}`);
                }

                const templateHTML = await response.text();

                // Inject the template
                document.documentElement.innerHTML = templateHTML;

                // STEP 3: Pass your app's configuration to the template
                window.appConfig = appConfig;

                // Trigger GPS initialization
                if (window.initializeGPS) {
                    window.initializeGPS();
                }
            } catch (error) {
                document.body.innerHTML = `
                    <div style="padding: 40px; text-align: center; color: #d32f2f;">
                        <h2>⚠️ Error Loading GPS Guide</h2>
                        <p style="margin: 20px 0; font-family: monospace; background: #f5f5f5; padding: 15px; border-radius: 8px;">
                            ${error.message}
                        </p>
                        <p style="color: #666;">Make sure GPS_GUIDE_TEMPLATE.html is in the parent directory.</p>
                    </div>
                `;
                console.error('GPS Guide Error:', error);
            }
        }

        // Start loading when page is ready
        document.addEventListener('DOMContentLoaded', loadGPSTemplate);
    </script>
</body>
</html>
