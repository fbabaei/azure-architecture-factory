[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aaf-mcp-server"
version = "0.1.0"
description = "Azure Architecture Factory — MCP server (Streamable HTTP)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0",
    "starlette>=0.46.0",
    "uvicorn[standard]>=0.34.0",
    "anyio>=4.9.0",
    "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
