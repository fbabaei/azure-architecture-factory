name: portal-deploy

on:
  push:
    branches:
      - main
    paths:
      - "factory-portal.html"
      - "scripts/start_factory_portal.py"
      - "scripts/local_brd_runner.py"
      - "Dockerfile.portal"
      - "assets/portal/**"
      - ".github/workflows/portal-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

# Only one deployment per environment at a time
concurrency:
  group: portal-deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: archfactorydevacr.azurecr.io
  PORTAL_IMAGE: archfactorydevacr.azurecr.io/portal
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'arch-factory-dev-rg' }}
  CONTAINER_APP_NAME: arch-factory-dev-portal

jobs:
  test:
    name: Portal tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --upgrade pip && pip install pytest
      - name: Run portal test suite
        run: python -m pytest tests/portal -v --tb=short

  build-and-deploy:
    name: Build & deploy portal
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC federated credential (no stored password)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name archfactorydevacr

      - name: Build and push portal image
        run: |
          IMAGE_TAG="${PORTAL_IMAGE}:${{ github.sha }}"
          docker build \
            --file Dockerfile.portal \
            --tag "${IMAGE_TAG}" \
            --tag "${PORTAL_IMAGE}:latest" \
            .
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Scan image with Trivy (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Push portal image (scan passed)
        run: |
          docker push "${IMAGE_TAG}"
          docker push "${PORTAL_IMAGE}:latest"

      - name: Update Container App revision
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_TAG }}" \
            --output none

      - name: Print portal URL
        id: portal-url
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "https://${FQDN}"
          echo "fqdn=${FQDN}" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed revision
        env:
          FQDN: ${{ steps.portal-url.outputs.fqdn }}
        run: |
          set -euo pipefail
          BASE="https://${FQDN}"
          echo "Waiting for new revision to serve traffic..."
          for i in $(seq 1 24); do
            body=$(curl -fsS --max-time 10 "${BASE}/health" || true)
            if echo "$body" | grep -q '"status": "ok"'; then
              echo "/health OK on attempt $i"
              echo "$body"
              break
            fi
            if [ "$i" = "24" ]; then
              echo "Timed out waiting for /health" >&2
              echo "Last body: $body" >&2
              exit 1
            fi
            sleep 5
          done
          echo "Probing /ready..."
          curl -fsS --max-time 15 "${BASE}/ready" | tee /tmp/ready.json
          python3 -c "import json,sys; d=json.load(open('/tmp/ready.json')); assert d.get('status')=='ok', d; print('ready OK')"
