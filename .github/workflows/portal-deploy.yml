name: portal-deploy

on:
  push:
    branches:
      - main
    paths:
      - "factory-portal.html"
      - "scripts/start_factory_portal.py"
      - "scripts/local_brd_runner.py"
      - "Dockerfile.portal"
      - "assets/portal/**"
      - ".github/workflows/portal-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

# Only one deployment per environment at a time
concurrency:
  group: portal-deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: archfactorydevacr.azurecr.io
  PORTAL_IMAGE: archfactorydevacr.azurecr.io/portal
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'arch-factory-dev-rg' }}
  CONTAINER_APP_NAME: arch-factory-dev-portal

jobs:
  build-and-deploy:
    name: Build & deploy portal
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC federated credential (no stored password)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name archfactorydevacr

      - name: Build and push portal image
        run: |
          IMAGE_TAG="${PORTAL_IMAGE}:${{ github.sha }}"
          docker build \
            --file Dockerfile.portal \
            --tag "${IMAGE_TAG}" \
            --tag "${PORTAL_IMAGE}:latest" \
            .
          docker push "${IMAGE_TAG}"
          docker push "${PORTAL_IMAGE}:latest"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Update Container App revision
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_TAG }}" \
            --output none

      - name: Print portal URL
        run: |
          az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv
