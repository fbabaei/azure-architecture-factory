apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: aks-micro-demo
  labels:
    app: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: REPLACE_WITH_ACR/payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: aks-micro-config
          env:
            - name: AKS_DEMO_SERVICE_NAME
              value: payment-service
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: aks-micro-demo
spec:
  selector:
    app: payment-service
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
