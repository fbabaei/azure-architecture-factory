apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aks-micro-ingress
  namespace: aks-micro-demo
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
spec:
  rules:
    - host: aks-micro.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
