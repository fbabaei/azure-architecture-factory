openapi: "3.0.3"
info:
  title: Azure Architecture Factory Portal API
  description: |
    REST API for the Azure Architecture Factory portal server.
    Accepts Business Requirements Documents (BRDs), orchestrates the
    architecture-generation pipeline, and exposes generated project data.
  version: "1.0.0"
  contact:
    name: Azure Architecture Factory
  license:
    name: MIT

servers:
  - url: https://arch-factory-dev-portal.politebeach-70e24eed.eastus.azurecontainerapps.io
    description: Azure Container Apps (production)
  - url: http://127.0.0.1:5501
    description: Local development server

tags:
  - name: BRD Intake
    description: Submit business requirements documents to the pipeline
  - name: Pipeline Runs
    description: Track pipeline execution status and results
  - name: Projects
    description: Query generated project data

paths:
  /api/brd-intake:
    post:
      operationId: submitBrd
      summary: Submit a BRD (JSON body)
      description: |
        Accepts a Business Requirements Document as JSON, saves it to the
        intake directory, and starts the architecture-generation pipeline
        in a background thread. Returns immediately with a run ID for
        polling.
      tags: [BRD Intake]
      security:
        - EntraIdAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrdIntakeRequest"
      responses:
        "202":
          description: BRD accepted and pipeline started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrdIntakeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/brd-upload:
    post:
      operationId: uploadBrd
      summary: Upload a BRD file (multipart)
      description: |
        Accepts a BRD as a multipart file upload. Optionally accepts a
        `project_name` field to override the filename. Starts the
        pipeline and returns a run ID.
      tags: [BRD Intake]
      security:
        - EntraIdAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [brd_file]
              properties:
                brd_file:
                  type: string
                  format: binary
                  description: The BRD markdown file (UTF-8)
                project_name:
                  type: string
                  description: Optional override for the BRD filename
      responses:
        "202":
          description: BRD accepted and pipeline started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrdIntakeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          description: Unsupported media type (expected multipart/form-data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/brd-runs:
    get:
      operationId: listRuns
      summary: List all pipeline runs
      description: Returns all tracked runs, newest first. Paths and command output are sanitized.
      tags: [Pipeline Runs]
      responses:
        "200":
          description: List of runs
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/RunSummary"

  /api/brd-runs/{runId}:
    get:
      operationId: getRunStatus
      summary: Get pipeline run status
      description: Returns the current status and result of a specific pipeline run.
      tags: [Pipeline Runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/brd-runs/{runId}/project:
    get:
      operationId: getRunProject
      summary: Get project generated by a pipeline run
      description: |
        Returns the full project payload produced by a completed pipeline
        run. If the run is still in progress, returns HTTP 202 with
        `project: null`.
      tags: [Pipeline Runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Completed run with project payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunProjectResponse"
        "202":
          description: Run still in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunProjectResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /factory-projects.generated.json:
    get:
      operationId: listProjects
      summary: Get the generated project feed
      description: |
        Returns the full project feed JSON generated by the in-repo
        Azure-native BRD runner.
      tags: [Projects]
      responses:
        "200":
          description: Project feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFeed"

  /api/project-analysis/{slug}:
    get:
      operationId: getProjectAnalysis
      summary: Get analysis for a project
      description: Generates and returns an analysis summary for the project identified by its slug.
      tags: [Projects]
      parameters:
        - name: slug
          in: path
          required: true
          description: URL-safe project slug
          schema:
            type: string
            example: smart-inventory-tracker-20260408222513
      responses:
        "200":
          description: Project analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAnalysis"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    EntraIdAuth:
      type: oauth2
      description: |
        Microsoft Entra ID (Azure AD) OAuth 2.0 bearer token.
        Enforced on POST mutation endpoints when ENTRA_TENANT_ID and
        ENTRA_CLIENT_ID environment variables are set. Tokens are
        validated against the tenant's JWKS endpoint with RS256
        signature verification, audience, issuer, and expiry checks.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/token
          scopes:
            api://{clientId}/.default: Default scope for the portal API
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/token
          scopes:
            api://{clientId}/.default: Default scope for the portal API
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Factory-Api-Key
      description: |
        HMAC-compared API key. Fallback auth when Entra ID is not
        configured. Only enforced on POST mutation endpoints when the
        `FACTORY_PORTAL_API_KEY` environment variable is set.
        GET endpoints do not require authentication.

  parameters:
    RunId:
      name: runId
      in: path
      required: true
      description: UUID of the pipeline run
      schema:
        type: string
        format: uuid
        example: "d290f1ee-6c54-4b01-90e6-d701748f0851"

  schemas:
    BrdIntakeRequest:
      type: object
      required: [fileName, content]
      properties:
        fileName:
          type: string
          description: |
            Filename for the BRD (must end in .md, alphanumeric with
            dots, hyphens, and underscores only).
          example: my-project-brd.md
          pattern: "^[A-Za-z0-9._-]+\\.md$"
        content:
          type: string
          description: Full markdown content of the BRD
          example: "# My Project\n\n## Overview\nBuild a web app..."

    BrdIntakeResponse:
      type: object
      required: [id, status, message, brdFile]
      properties:
        id:
          type: string
          format: uuid
          description: Unique run identifier for polling
        status:
          type: string
          enum: [queued]
        message:
          type: string
          example: BRD received and pipeline started.
        brdFile:
          type: string
          description: Path where the BRD was saved

    RunSummary:
      type: object
      description: Sanitized run summary (no local paths or command output)
      properties:
        id:
          type: string
          format: uuid
        brdFile:
          type: string
          description: BRD filename (basename only, no path)
        status:
          $ref: "#/components/schemas/RunStatus"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        returnCode:
          type: integer
          nullable: true

    RunDetail:
      type: object
      description: Full run status with pipeline result
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RunStatus"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        returnCode:
          type: integer
          nullable: true
        result:
          type: object
          nullable: true
          description: Pipeline output (JSON parsed from stdout on success)

    RunStatus:
      type: string
      enum: [queued, running, completed, error]

    RunProjectResponse:
      type: object
      required: [run, project, analysis]
      properties:
        run:
          $ref: "#/components/schemas/RunDetail"
        project:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Project"
        analysis:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ProjectAnalysis"
        warning:
          type: string
          description: Present when the project feed file is missing

    ProjectFeed:
      type: object
      required: [generatedAt, projects]
      properties:
        generatedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the feed was last generated
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"

    Project:
      type: object
      properties:
        slug:
          type: string
          example: smart-inventory-tracker-20260408222513
        title:
          type: string
          example: Smart Inventory Tracker
        status:
          type: string
          example: generated
        generatedFrom:
          type: string
          description: BRD filename that produced this project
          example: smart-inventory-tracker.md
        generatedAt:
          type: string
          format: date-time
        links:
          $ref: "#/components/schemas/ProjectLinks"
        runLog:
          type: string
          description: Relative path to the pipeline run log

    ProjectLinks:
      type: object
      description: Relative paths to key project artifacts
      properties:
        readme:
          type: string
          example: projects/smart-inventory-tracker-20260408222513/README.md
        deploy:
          type: string
          example: projects/smart-inventory-tracker-20260408222513/DEPLOY.md
        diagram:
          type: string
          example: projects/smart-inventory-tracker-20260408222513/diagrams/smart-inventory-tracker-20260408222513.drawio
        architectureOverview:
          type: string
          example: projects/smart-inventory-tracker-20260408222513/docs/architecture-overview.md
        traceability:
          type: string
          example: projects/smart-inventory-tracker-20260408222513/docs/traceability-matrix.md

    ProjectAnalysis:
      type: object
      properties:
        title:
          type: string
        projectSlug:
          type: string
        generatedFrom:
          type: string
        designChoice:
          type: string
        benefits:
          type: array
          items:
            type: string
        alternativeConsidered:
          type: string
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message

  responses:
    BadRequest:
      description: Invalid request (missing fields, bad filename, etc.)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Unauthorized
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request body exceeds 1 MB limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Payload too large (max 1000000 bytes)"
