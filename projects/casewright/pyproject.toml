[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casewright"
version = "1.0.0"
description = "Casewright — agentic case-knowledge platform with grounded RAG chat and SharePoint ingestion."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "azure-identity>=1.17",
    "azure-search-documents>=11.5.2",
    "azure-storage-blob>=12.20",
    "azure-servicebus>=7.12",
    "azure-cosmos>=4.7",
    "openai>=1.40",
    "httpx>=0.27",
    "azure-monitor-opentelemetry>=1.6",
    "azure-ai-textanalytics>=5.3",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
casewright = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
